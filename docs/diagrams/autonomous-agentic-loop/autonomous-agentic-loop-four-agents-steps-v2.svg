<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1600" viewBox="0 0 1100 1600" role="img" aria-labelledby="title description">
  <title id="title">Case 4 - Preparation, idea collection, and escalation</title>
  <desc id="description">Architect splits tasks, checks with Developer that they are clear and minimal, and refines them before authorized development. Developer implements and calls Tester. Developer and Tester can post additional ideas to Architect for summarization without expanding scope. The first Tester pipeline failure returns to Developer through Dispatcher; the second calls Architect to review abandoning, redrafting, or trying once again. Approval requirements remain separate.</desc>
  <defs>
    <linearGradient id="a"><stop stop-color="#fff"/><stop offset="1" stop-color="#f3eafb"/></linearGradient>
    <linearGradient id="d"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8f8ed"/></linearGradient>
    <linearGradient id="t"><stop stop-color="#fff"/><stop offset="1" stop-color="#fcecec"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#526579"/></marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; font-size: 23px; text-anchor: middle; fill: #172b4d; }
      .heading { font-size: 26px; font-weight: 600; text-anchor: start; }
      .box { fill: #fff; stroke: #94a3b8; stroke-width: 2; }
      .a { fill: url(#a); stroke: #9333ea; }
      .d { fill: url(#d); stroke: #27804a; }
      .t { fill: url(#t); stroke: #dc2626; }
      .line { fill: none; stroke: #526579; stroke-width: 2.5; marker-end: url(#arrow); }
      .note { font-size: 21px; }
    </style>
  </defs>
  <rect width="1100" height="1600" rx="12" fill="#fff"/>

  <rect x="40" y="20" width="1020" height="210" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text class="heading" x="60" y="57">Dispatcher - scheduled hourly</text>
  <text x="550" y="98">1. Check active task, PR feedback, and failure count</text>
  <rect class="box a" x="65" y="125" width="300" height="75"/>
  <text x="215" y="155"><tspan x="215">New work / preparation</tspan><tspan x="215" dy="27">Call Architect</tspan></text>
  <rect class="box d" x="400" y="125" width="300" height="75"/>
  <text x="550" y="155"><tspan x="550">First failed test pipeline</tspan><tspan x="550" dy="27">Call Developer to fix</tspan></text>
  <rect class="box a" x="735" y="125" width="300" height="75"/>
  <text x="885" y="155"><tspan x="885">Second failed test pipeline</tspan><tspan x="885" dy="27">Call Architect to review</tspan></text>

  <rect x="40" y="265" width="1020" height="250" rx="16" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/>
  <text class="heading" x="60" y="303">Architect - before development</text>
  <rect class="box" x="65" y="335" width="280" height="75"/>
  <text x="205" y="365"><tspan x="205">2. Split work into</tspan><tspan x="205" dy="27">bounded, minimal tasks</tspan></text>
  <path class="line" d="M345 372 H390"/>
  <rect class="box d" x="390" y="335" width="320" height="75"/>
  <text x="550" y="365"><tspan x="550">3. Verify with Developer:</tspan><tspan x="550" dy="27">clear and minimal?</tspan></text>
  <path class="line" d="M710 372 H755"/>
  <rect class="box" x="755" y="335" width="280" height="75"/>
  <text x="895" y="365"><tspan x="895">4. Refine task</tspan><tspan x="895" dy="27">until clear</tspan></text>
  <text class="note" x="550" y="460">Then hand off for development under the required human approvals</text>

  <rect x="40" y="550" width="1020" height="175" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <text class="heading" x="60" y="588">Developer - implementation / correction</text>
  <rect class="box" x="65" y="615" width="400" height="75"/>
  <text x="265" y="645"><tspan x="265">5. Implement / fix, validate,</tspan><tspan x="265" dy="27">and push PR</tspan></text>
  <path class="line" d="M465 652 H545"/>
  <rect class="box t" x="545" y="625" width="310" height="55"/>
  <text x="700" y="660">6. Call Tester; finish</text>

  <rect x="40" y="760" width="1020" height="200" rx="16" fill="#fff5f5" stroke="#f87171" stroke-width="2"/>
  <text class="heading" x="60" y="798">Tester - same validation flow as Case 3</text>
  <rect class="box" x="65" y="825" width="400" height="75"/>
  <text x="265" y="855"><tspan x="265">7. Verify minimal changes,</tspan><tspan x="265" dy="27">requirements, and UX</tspan></text>
  <path class="line" d="M465 862 H545"/>
  <rect class="box" x="545" y="825" width="490" height="75"/>
  <text x="790" y="855"><tspan x="790">8. Pass: final pipeline, then merge</tspan><tspan x="790" dy="27">Fail: PR feedback + failure count</tspan></text>
  <text class="note" x="550" y="938">Failure handling is routed by Dispatcher on its next hourly run</text>

  <rect x="40" y="995" width="1020" height="190" rx="16" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/>
  <text class="heading" x="60" y="1033">Architect - during development (side channel)</text>
  <rect class="box a" x="65" y="1060" width="400" height="75"/>
  <text x="265" y="1090"><tspan x="265">9. Developer / Tester post ideas,</tspan><tspan x="265" dy="27">corner cases, improvements, comments</tspan></text>
  <path class="line" d="M465 1097 H545"/>
  <rect class="box" x="545" y="1060" width="490" height="75"/>
  <text x="790" y="1090"><tspan x="790">10. Summarize for later discussion</tspan><tspan x="790" dy="27">Do not silently expand current task</tspan></text>

  <rect x="40" y="1220" width="1020" height="300" rx="16" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/>
  <text class="heading" x="60" y="1258">Architect - escalation after the second failure</text>
  <rect class="box" x="365" y="1285" width="370" height="65"/>
  <text x="550" y="1312"><tspan x="550">11. Review task, failure history,</tspan><tspan x="550" dy="26">and feasibility</tspan></text>
  <path class="line" d="M550 1350 V1380"/>
  <rect class="box" x="65" y="1380" width="300" height="65"/>
  <text x="215" y="1407"><tspan x="215">Abandon?</tspan><tspan x="215" dy="26">Record rationale for approval</tspan></text>
  <rect class="box" x="400" y="1380" width="300" height="65"/>
  <text x="550" y="1407"><tspan x="550">Redraft task?</tspan><tspan x="550" dy="26">Return to preparation</tspan></text>
  <rect class="box d" x="735" y="1380" width="300" height="65"/>
  <text x="885" y="1407"><tspan x="885">Try once again?</tspan><tspan x="885" dy="26">Developer gets recovery plan</tspan></text>
  <text class="note" x="550" y="1490">Approval and retry-policy details remain open; no automatic endless retry</text>

  <path class="line" d="M550 230 V265" stroke-dasharray="7 5"/>
  <path class="line" d="M550 515 V550" stroke-dasharray="7 5"/>
  <path class="line" d="M550 725 V760" stroke-dasharray="7 5"/>
  <text class="note" x="550" y="1570">Architect's three panels represent one role at different points, not parallel workers</text>
</svg>
