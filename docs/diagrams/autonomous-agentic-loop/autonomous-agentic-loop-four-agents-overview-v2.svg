<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" role="img" aria-labelledby="title description">
  <title id="title">Case 4 - Architect's three flows</title>
  <desc id="description">Architect splits tasks and checks clarity and minimal scope with Developer before development. Developer calls Tester directly. Both Developer and Tester can post ideas to Architect for summarization. Dispatcher routes routine failures to Developer and the second Tester pipeline failure to Architect, who reviews abandonment, redrafting, or one more attempt.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#526579"/></marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; font-size: 23px; text-anchor: middle; fill: #172b4d; }
      .name { font-size: 29px; font-weight: 600; }
      .line { fill: none; stroke: #526579; stroke-width: 2.5; marker-end: url(#arrow); }
      .note { font-size: 20px; }
    </style>
  </defs>
  <rect width="1100" height="800" rx="12" fill="#fff"/>
  <rect x="375" y="25" width="350" height="100" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text class="name" x="550" y="67">Dispatcher</text>
  <text x="550" y="103">Hourly pickup / failure routing</text>
  <rect x="70" y="275" width="350" height="155" rx="16" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/>
  <text class="name" x="245" y="319">Architect</text>
  <text x="245" y="355">Prepare tasks</text>
  <text x="245" y="384">Summarize ideas</text>
  <text x="245" y="413">Review repeated failure</text>
  <rect x="680" y="275" width="350" height="120" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <text class="name" x="855" y="324">Developer</text>
  <text x="855" y="365">Clarify / implement / fix</text>
  <rect x="680" y="580" width="350" height="120" rx="16" fill="#fff5f5" stroke="#f87171" stroke-width="2"/>
  <text class="name" x="855" y="629">Tester</text>
  <text x="855" y="670">Validate / final pipeline</text>
  <path class="line" d="M430 125 V180 H245 V275"/>
  <text class="note" x="245" y="164">New task / second failure</text>
  <path class="line" d="M670 125 V205 H855 V275"/>
  <text class="note" x="865" y="189">Routine correction</text>
  <path class="line" d="M420 305 H680"/>
  <text class="note" x="550" y="290">Split tasks / check clear and minimal</text>
  <path class="line" d="M680 375 H420"/>
  <text class="note" x="550" y="405">Clarification / ideas</text>
  <path class="line" d="M855 395 V580"/>
  <text class="note" x="950" y="475">Call Tester</text>
  <path class="line" d="M680 640 H245 V430" stroke-dasharray="7 5"/>
  <text class="note" x="440" y="625">Post ideas / corner cases / comments</text>
  <text class="note" x="550" y="752">Tester failures are recorded on PR; Dispatcher routes the next action</text>
</svg>
