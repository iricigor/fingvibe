name: UI/UX review

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ui-ux-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui-ux-review:
    name: ui-ux-review
    runs-on: [self-hosted, Windows, X64, ui-review]
    env:
      FINGVIBE_UI_REVIEW: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Test networking core
        id: tests
        run: dotnet test tests\FingVibe.Core.Tests\FingVibe.Core.Tests.csproj --configuration Release

      - name: Publish review build
        id: publish
        shell: pwsh
        run: |
          msbuild src\FingVibe.App\FingVibe.App.csproj `
            /restore `
            /target:Publish `
            /property:Configuration=Release `
            /property:Platform=x64 `
            /property:RuntimeIdentifier=win-x64 `
            /property:SelfContained=true `
            /property:PublishDir="${{ github.workspace }}\artifacts\ui-review-app\"

      - name: Exercise primary UI and capture screenshot
        id: smoke
        shell: pwsh
        run: |
          .\.github\scripts\Invoke-UiReview.ps1 `
            -AppPath "${{ github.workspace }}\artifacts\ui-review-app\FingVibe.App.exe" `
            -ScreenshotPath "${{ github.workspace }}\artifacts\ui-review\fingvibe-ui-review.png"

      - name: Upload UI review screenshot
        id: screenshot
        uses: actions/upload-artifact@v4
        with:
          name: fingvibe-ui-review-pr-${{ github.event.pull_request.number || github.run_number }}
          path: artifacts\ui-review\fingvibe-ui-review.png
          if-no-files-found: error
          retention-days: 14

      - name: Add screenshot link to pull request
        id: pr-comment
        if: >
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]'
        env:
          ARTIFACT_URL: ${{ steps.screenshot.outputs.artifact-url }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: pwsh
        run: |
          $marker = "<!-- fingvibe-ui-review -->"
          $body = @"
          $marker
          ## UI/UX review screenshot

          The automated reviewer launched FingVibe, exercised **Scan LAN**, and captured the resulting UI.

          [View or download the current app screenshot]($env:ARTIFACT_URL)

          The screenshot artifact expires after 14 days. A missing screenshot or broken primary interaction fails the ``ui-ux-review`` check.
          "@

          $comments = gh api `
            "repos/$env:GITHUB_REPOSITORY/issues/$env:PR_NUMBER/comments" `
            --paginate | ConvertFrom-Json
          $existing = $comments |
            Where-Object { $_.user.login -eq "github-actions[bot]" -and $_.body.Contains($marker) } |
            Select-Object -First 1

          if ($existing) {
            @{ body = $body } |
              ConvertTo-Json |
              gh api --method PATCH `
                "repos/$env:GITHUB_REPOSITORY/issues/comments/$($existing.id)" `
                --input -
          } else {
            gh pr comment $env:PR_NUMBER --body $body
          }

          "Screenshot artifact: $env:ARTIFACT_URL" >> $env:GITHUB_STEP_SUMMARY

      - name: Explain UI/UX review failure
        if: >
          failure()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]'
        env:
          COMMENT_OUTCOME: ${{ steps.pr-comment.outcome }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SCREENSHOT_OUTCOME: ${{ steps.screenshot.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        shell: pwsh
        run: |
          $reasons = [System.Collections.Generic.List[string]]::new()
          if ($env:TEST_OUTCOME -eq "failure") {
            $reasons.Add("- Core tests failed, so the primary application behavior is not safe to review.")
          }
          if ($env:PUBLISH_OUTCOME -eq "failure") {
            $reasons.Add("- The WinUI application could not be built and published.")
          }
          if ($env:SMOKE_OUTCOME -eq "failure") {
            $reasons.Add("- The app failed its native UI smoke test. It may not launch or render, a critical accessible control may be missing, the Scan LAN interaction may be broken, or a valid screenshot could not be captured.")
          }
          if ($env:SCREENSHOT_OUTCOME -eq "failure") {
            $reasons.Add("- The UI screenshot could not be uploaded as a workflow artifact.")
          }
          if ($env:COMMENT_OUTCOME -eq "failure") {
            $reasons.Add("- The screenshot was captured, but its pull-request comment could not be created or updated.")
          }
          if ($reasons.Count -eq 0) {
            $reasons.Add("- The UI/UX workflow failed unexpectedly. Inspect the failed step in the workflow run.")
          }

          $marker = "<!-- fingvibe-ui-review-failure -->"
          $body = @"
          $marker
          ## UI/UX review failed

          $($reasons -join "`n")

          [Open the failed UI/UX review run]($env:RUN_URL)
          "@

          $comments = gh api `
            "repos/$env:GITHUB_REPOSITORY/issues/$env:PR_NUMBER/comments" `
            --paginate | ConvertFrom-Json
          $existing = $comments |
            Where-Object { $_.user.login -eq "github-actions[bot]" -and $_.body.Contains($marker) } |
            Select-Object -First 1

          if ($existing) {
            @{ body = $body } |
              ConvertTo-Json |
              gh api --method PATCH `
                "repos/$env:GITHUB_REPOSITORY/issues/comments/$($existing.id)" `
                --input -
          } else {
            gh pr comment $env:PR_NUMBER --body $body
          }

      - name: Clear resolved UI/UX failure comment
        if: >
          success()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: pwsh
        run: |
          $marker = "<!-- fingvibe-ui-review-failure -->"
          $comments = gh api `
            "repos/$env:GITHUB_REPOSITORY/issues/$env:PR_NUMBER/comments" `
            --paginate | ConvertFrom-Json
          $existing = $comments |
            Where-Object { $_.user.login -eq "github-actions[bot]" -and $_.body.Contains($marker) } |
            Select-Object -First 1
          if ($existing) {
            gh api --method DELETE `
              "repos/$env:GITHUB_REPOSITORY/issues/comments/$($existing.id)"
          }
