name: UI/UX review

on:
  pull_request:
  workflow_dispatch:
    inputs:
      additional_scenarios:
        description: "Extra captures (comma-separated): Overview, Network, DeviceDetails, People, PersonDetails, Rooms, RoomDetails, Settings, DevicesEmpty"
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ui-ux-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui-ux-review:
    name: ui-ux-review
    if: >
      github.event_name == 'workflow_dispatch'
      || (
        github.event.pull_request.head.repo.full_name == github.repository
        && (
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
          || github.event.pull_request.user.login == 'Copilot'
        )
      )
    runs-on: windows-2025
    env:
      FINGVIBE_UI_REVIEW: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Test networking core
        id: tests
        run: dotnet test tests\FingVibe.Core.Tests\FingVibe.Core.Tests.csproj --configuration Release

      - name: Test full-window screenshot capture
        id: capture-tests
        shell: pwsh
        run: .\tests\UiReviewScreenshot.Tests.ps1

      - name: Test capture scenario selection and navigation
        id: scenario-tests
        shell: pwsh
        run: .\tests\UiReviewScenarios.Tests.ps1

      - name: Select changed views and states
        id: plan
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          ADDITIONAL_SCENARIOS: ${{ inputs.additional_scenarios }}
        shell: pwsh
        run: |
          .\.github\scripts\Select-UiReviewScenarios.ps1 `
            -PlanPath "${{ github.workspace }}\artifacts\ui-review\capture-plan.json" `
            -BaseRevision $env:BASE_REVISION `
            -HeadRevision $env:HEAD_REVISION `
            -AdditionalScenarios $env:ADDITIONAL_SCENARIOS

      - name: Publish review build
        id: publish
        shell: pwsh
        run: |
          msbuild src\FingVibe.App\FingVibe.App.csproj `
            /restore `
            /target:Publish `
            /property:Configuration=Release `
            /property:Platform=x64 `
            /property:RuntimeIdentifier=win-x64 `
            /property:SelfContained=true `
            /property:PublishDir="${{ github.workspace }}\artifacts\ui-review-app\"

      - name: Exercise primary UI and capture required views
        id: smoke
        shell: pwsh
        run: |
          .\.github\scripts\Invoke-UiReview.ps1 `
            -AppPath "${{ github.workspace }}\artifacts\ui-review-app\FingVibe.App.exe" `
            -ScreenshotDirectory "${{ github.workspace }}\artifacts\ui-review" `
            -CapturePlanPath "${{ github.workspace }}\artifacts\ui-review\capture-plan.json"

      - name: Upload UI review screenshot
        id: screenshot
        uses: actions/upload-artifact@v4
        with:
          name: fingvibe-ui-review-pr-${{ github.event.pull_request.number || github.run_number }}
          path: artifacts\ui-review\
          if-no-files-found: error
          retention-days: 14

      - name: Publish screenshot for inline review
        id: pages
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: pwsh
        run: |
          .\.github\scripts\Publish-UiReviewScreenshot.ps1 `
            -ManifestPath "${{ github.workspace }}\artifacts\ui-review\capture-manifest.json" `
            -PullRequestNumber $env:PR_NUMBER `
            -Repository $env:GITHUB_REPOSITORY `
            -RunId $env:GITHUB_RUN_ID

      - name: Add screenshot to pull request
        id: pr-comment
        if: >
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]'
        env:
          ARTIFACT_URL: ${{ steps.screenshot.outputs.artifact-url }}
          GH_TOKEN: ${{ github.token }}
          COMMENT_BODY_PATH: ${{ steps.pages.outputs.body-path }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: pwsh
        run: |
          $marker = "<!-- fingvibe-ui-review -->"
          $body = Get-Content -LiteralPath $env:COMMENT_BODY_PATH -Raw

          $comments = gh api `
            "repos/$env:GITHUB_REPOSITORY/issues/$env:PR_NUMBER/comments" `
            --paginate | ConvertFrom-Json
          $existing = $comments |
            Where-Object { $_.user.login -eq "github-actions[bot]" -and $_.body.Contains($marker) } |
            Select-Object -First 1

          if ($existing) {
            @{ body = $body } |
              ConvertTo-Json |
              gh api --method PATCH `
                "repos/$env:GITHUB_REPOSITORY/issues/comments/$($existing.id)" `
                --input -
          } else {
            gh pr comment $env:PR_NUMBER --body $body
          }

          $body >> $env:GITHUB_STEP_SUMMARY
          "Workflow artifact: $env:ARTIFACT_URL" >> $env:GITHUB_STEP_SUMMARY

      - name: Explain UI/UX review failure
        if: >
          failure()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]'
        env:
          COMMENT_OUTCOME: ${{ steps.pr-comment.outcome }}
          CAPTURE_TEST_OUTCOME: ${{ steps.capture-tests.outcome }}
          SCENARIO_TEST_OUTCOME: ${{ steps.scenario-tests.outcome }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          PAGES_OUTCOME: ${{ steps.pages.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SCREENSHOT_OUTCOME: ${{ steps.screenshot.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        shell: pwsh
        run: |
          $reasons = [System.Collections.Generic.List[string]]::new()
          if ($env:TEST_OUTCOME -eq "failure") {
            $reasons.Add("- Core tests failed, so the primary application behavior is not safe to review.")
          }
          if ($env:CAPTURE_TEST_OUTCOME -eq "failure") {
            $reasons.Add("- Full-window capture regression tests failed; screenshots may omit application edges.")
          }
          if ($env:SCENARIO_TEST_OUTCOME -eq "failure") {
            $reasons.Add("- Capture scenario selection, navigation, or publishing regression tests failed.")
          }
          if ($env:PLAN_OUTCOME -eq "failure") {
            $reasons.Add("- Required capture scenarios could not be selected from the PR changes. Inspect the capture-plan step.")
          }
          if ($env:PUBLISH_OUTCOME -eq "failure") {
            $reasons.Add("- The WinUI application could not be built and published.")
          }
          if ($env:SMOKE_OUTCOME -eq "failure") {
            $reasons.Add("- The app failed its native UI smoke test or a required view/state could not be reached, verified, or captured. Inspect the capture scenario named in the run log.")
          }
          if ($env:SCREENSHOT_OUTCOME -eq "failure") {
            $reasons.Add("- The UI screenshot could not be uploaded as a workflow artifact.")
          }
          if ($env:PAGES_OUTCOME -eq "failure") {
            $reasons.Add("- The UI screenshot could not be published for inline pull-request review.")
          }
          if ($env:COMMENT_OUTCOME -eq "failure") {
            $reasons.Add("- The screenshot was captured, but its pull-request comment could not be created or updated.")
          }
          if ($reasons.Count -eq 0) {
            $reasons.Add("- The UI/UX workflow failed unexpectedly. Inspect the failed step in the workflow run.")
          }

          $marker = "<!-- fingvibe-ui-review-failure -->"
          $body = @"
          $marker
          ## UI/UX review failed

          $($reasons -join "`n")

          [Open the failed UI/UX review run]($env:RUN_URL)
          "@

          $comments = gh api `
            "repos/$env:GITHUB_REPOSITORY/issues/$env:PR_NUMBER/comments" `
            --paginate | ConvertFrom-Json
          $existing = $comments |
            Where-Object { $_.user.login -eq "github-actions[bot]" -and $_.body.Contains($marker) } |
            Select-Object -First 1

          if ($existing) {
            @{ body = $body } |
              ConvertTo-Json |
              gh api --method PATCH `
                "repos/$env:GITHUB_REPOSITORY/issues/comments/$($existing.id)" `
                --input -
          } else {
            gh pr comment $env:PR_NUMBER --body $body
          }

      - name: Clear resolved UI/UX failure comment
        if: >
          success()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: pwsh
        run: |
          $marker = "<!-- fingvibe-ui-review-failure -->"
          $comments = gh api `
            "repos/$env:GITHUB_REPOSITORY/issues/$env:PR_NUMBER/comments" `
            --paginate | ConvertFrom-Json
          $existing = $comments |
            Where-Object { $_.user.login -eq "github-actions[bot]" -and $_.body.Contains($marker) } |
            Select-Object -First 1
          if ($existing) {
            gh api --method DELETE `
              "repos/$env:GITHUB_REPOSITORY/issues/comments/$($existing.id)"
          }
