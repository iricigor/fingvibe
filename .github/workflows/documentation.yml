name: Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "tools/requirements-docs.txt"
      - "tools/Check-Documentation.py"
      - "tests/Documentation.Tests.py"
      - ".github/workflows/documentation.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "tools/requirements-docs.txt"
      - "tools/Check-Documentation.py"
      - "tests/Documentation.Tests.py"
      - ".github/workflows/documentation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and check documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r tools/requirements-docs.txt

      - name: Test documentation checks
        run: python tests/Documentation.Tests.py

      - name: Build the site strictly
        run: python -m mkdocs build --strict

      - name: Check published links, images, icons, and search
        run: python tools/Check-Documentation.py site

      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy the checked site
        id: deployment
        uses: actions/deploy-pages@v4
