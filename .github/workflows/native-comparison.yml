name: Native validation comparison (observational)

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/**'
      - '*.sln'
      - 'Directory.*'
      - 'global.json'
      - '**/NuGet.Config'
      - '**/nuget.config'
  workflow_dispatch:
    inputs:
      mode:
        description: Candidate rehearsal on the selected branch (not standalone main validation)
        type: choice
        options: [Baseline, Full]
        default: Baseline
      revision:
        description: Optional same-repository source revision for historical comparison (default selected branch)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: native-comparison-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  comparison:
    if: >
      github.event_name == 'workflow_dispatch'
      || (
        github.event.pull_request.head.repo.full_name == github.repository
        && (
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
          || github.event.pull_request.user.login == 'Copilot'
        )
      )
    uses: ./.github/workflows/native-validation.yml
    with:
      mode: ${{ inputs.mode || 'Baseline' }}
      revision: ${{ github.event.pull_request.head.sha || inputs.revision || github.sha }}
      pull-request: ${{ github.event.pull_request.number || 0 }}
