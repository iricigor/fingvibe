name: 🔨 Pull request build

on:
  pull_request:
  workflow_dispatch:
    inputs:
      appearance_archive:
        description: "Capture the pinned #160 appearance archive on a disposable runner"
        type: boolean
        default: false
      additional_scenarios:
        description: "Extra captures (comma-separated): Overview, Network, DeviceDetails, People, PersonDetails, Rooms, RoomDetails, Tools, SpeedTest, Troubleshooting, About, FingImport, Settings, DevicesEmpty"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  appearance-archive:
    if: github.event_name == 'workflow_dispatch' && inputs.appearance_archive == true
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: microsoft/setup-msbuild@v2
      - name: Extract and validate the immutable source archive
        shell: pwsh
        run: |
          $archive = "docs\archive\appearance-deae2a19c2cc"
          python "$archive\evidence\verify.py" --source-only
          if ($LASTEXITCODE -ne 0) { throw "Archive source verification failed." }
          Expand-Archive -LiteralPath "$archive\fingvibe-source-deae2a19c2cc8218183f08b777347215b7fa31e6.zip" -DestinationPath artifacts\archive-source
          New-Item -ItemType Directory artifacts\archive-evidence -Force | Out-Null
      - name: Test and build extracted source without Git history
        shell: pwsh
        run: |
          $evidence = (Resolve-Path artifacts\archive-evidence).Path
          Push-Location artifacts\archive-source
          try {
            $project = "tests\FingVibe.Core.Tests\FingVibe.Core.Tests.csproj"
            $filter = "FullyQualifiedName~AppearancePaletteTests|FullyQualifiedName~AppearanceSettingsStoreTests"
            dotnet test $project --no-restore -c Release --filter $filter 2>&1 | Tee-Object "$evidence\appearance-tests.log"
            if ($LASTEXITCODE -ne 0) {
              if (-not (Select-String -LiteralPath "$evidence\appearance-tests.log" -Pattern NETSDK1004 -Quiet)) {
                throw "Appearance checks failed for a reason other than missing dependencies."
              }
              dotnet test $project -c Release --filter $filter 2>&1 | Tee-Object -Append "$evidence\appearance-tests.log"
              if ($LASTEXITCODE -ne 0) { throw "Restored appearance checks failed." }
            }
            $properties = @("/target:Publish", "/property:Configuration=Release", "/property:Platform=x64",
              "/property:RuntimeIdentifier=win-x64", "/property:SelfContained=true",
              "/property:Version=0.0.160", "/property:BuildKind=Test",
              "/property:BuildCommit=deae2a19c2cc8218183f08b777347215b7fa31e6",
              "/property:BuildTimestamp=$([DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))",
              "/property:BuildUrl=https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
              "/property:PublishDir=$env:GITHUB_WORKSPACE\artifacts\archive-app\")
            msbuild src\FingVibe.App\FingVibe.App.csproj @properties 2>&1 | Tee-Object "$evidence\build.log"
            if ($LASTEXITCODE -ne 0) {
              if (-not (Select-String -LiteralPath "$evidence\build.log" -Pattern NETSDK1004 -Quiet)) {
                throw "Extracted source build failed for a reason other than missing dependencies."
              }
              msbuild src\FingVibe.App\FingVibe.App.csproj /restore @properties 2>&1 | Tee-Object -Append "$evidence\build.log"
              if ($LASTEXITCODE -ne 0) { throw "Restored extracted source build failed." }
            }
          } finally { Pop-Location }
      - name: Prepare disposable desktop
        shell: powershell
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Capture the 25 approved images from the extracted-source build
        shell: powershell
        run: |
          Start-Transcript -Path artifacts\archive-evidence\capture.log
          try {
            .\docs\archive\appearance-deae2a19c2cc\evidence\Capture.ps1 `
              -SourceDirectory "$env:GITHUB_WORKSPACE\artifacts\archive-source" `
              -AppPath "$env:GITHUB_WORKSPACE\artifacts\archive-app\FingVibe.App.exe" `
              -OutputDirectory "$env:GITHUB_WORKSPACE\artifacts\archive-evidence\screenshots" `
              -SourceZipSha256 fcd5df9c7fe7b6b2fd3fca7e53dface25fea9338368e55d6f29b18488d2848b2
          } finally { Stop-Transcript }
      - name: Preserve archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appearance-archive-evidence
          path: artifacts\archive-evidence
          if-no-files-found: error
          retention-days: 14

  changes:
    if: inputs.appearance_archive != true
    runs-on: windows-latest
    outputs:
      tests: ${{ steps.changes.outputs.tests }}
      build: ${{ steps.changes.outputs.build }}
      ui: ${{ steps.changes.outputs.ui }}
    steps:
      - name: Check out source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select validation work
        id: changes
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: pwsh
        run: |
          .\.github\scripts\Get-PrValidationChanges.ps1 `
            -BaseRevision $env:BASE_REVISION -HeadRevision $env:HEAD_REVISION `
            -Manual:($env:EVENT_NAME -eq "workflow_dispatch")

  tests:
    name: core-tests
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test networking core
        run: dotnet test tests\FingVibe.Core.Tests\FingVibe.Core.Tests.csproj --configuration Release

      - name: Test speed-test bridge
        run: node --test tests\SpeedTestHost.Tests.cjs

      - name: Test scenario selection, navigation, and publishing
        shell: pwsh
        run: .\tests\UiReviewScenarios.Tests.ps1

      - name: Test additional service UI helpers without desktop automation
        shell: pwsh
        run: .\tests\AdditionalServices.Script.Tests.ps1

      - name: Test validation planning and comments
        shell: pwsh
        run: .\tests\PrValidation.Tests.ps1

      - name: Test ISP logo build configuration
        shell: pwsh
        run: .\tests\LogoDevConfiguration.Tests.ps1

      - name: Test build timestamp metadata
        shell: pwsh
        run: .\tests\BuildIdentity.Metadata.Tests.ps1

      - name: Test installer packaging helpers
        shell: pwsh
        run: .\tests\Installer.Script.Tests.ps1

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      build-timestamp: ${{ steps.publish.outputs.build-timestamp }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Publish Windows x64 app
        id: publish
        shell: pwsh
        run: |
          $buildTimestamp = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ", [Globalization.CultureInfo]::InvariantCulture)
          "build-timestamp=$buildTimestamp" >> $env:GITHUB_OUTPUT
          msbuild src\FingVibe.App\FingVibe.App.csproj `
            /restore `
            /target:Publish `
            /property:Configuration=Release `
            /property:Platform=x64 `
            /property:RuntimeIdentifier=win-x64 `
            /property:SelfContained=true `
            /property:Version=0.0.${{ github.run_number }} `
            /property:BuildKind=${{ github.event_name == 'pull_request' && 'PullRequest' || 'Test' }} `
            /property:PullRequestNumber=${{ github.event.pull_request.number }} `
            /property:BuildCommit=${{ github.sha }} `
            /property:BuildTimestamp="$buildTimestamp" `
            /property:BuildUrl="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" `
            /property:PublishDir="${{ github.workspace }}\artifacts\fingvibe-win-x64\"
          if ($LASTEXITCODE -ne 0) { throw "Windows app publish failed." }

      - name: Verify published application icons
        shell: pwsh
        run: .\tests\ApplicationIcon.Tests.ps1 -AppDirectory "${{ github.workspace }}\artifacts\fingvibe-win-x64"

      - name: Verify published build timestamp
        shell: pwsh
        run: .\tests\BuildIdentity.Metadata.Tests.ps1 -AppDirectory "${{ github.workspace }}\artifacts\fingvibe-win-x64" -BuildTimestamp "${{ steps.publish.outputs.build-timestamp }}"

      - name: Upload unvalidated payload for downstream checks
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: fingvibe-validation-payload-pr-${{ github.event.pull_request.number || github.run_number }}-attempt-${{ github.run_attempt }}
          path: artifacts\fingvibe-win-x64
          if-no-files-found: error
          retention-days: 1

  installer:
    needs: [changes, tests, build]
    if: needs.changes.outputs.build == 'true'
    runs-on: windows-latest
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - name: Check out installer validation
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the published payload
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: artifacts\fingvibe-win-x64

      - name: Build unsigned per-user installer
        shell: pwsh
        run: .\tools\New-Installer.ps1 -AppDirectory artifacts\fingvibe-win-x64 -Version "0.0.${{ github.run_number }}" -OutputDirectory artifacts\installer

      - name: Verify installer lifecycle on disposable runner
        shell: pwsh
        run: |
          .\tests\Installer.Lifecycle.Tests.ps1 `
            -AppDirectory artifacts\fingvibe-win-x64 `
            -InstallerPath "artifacts\installer\FingVibe-0.0.${{ github.run_number }}-win-x64-Setup.exe" `
            -Version "0.0.${{ github.run_number }}" -LogDirectory artifacts\installer-logs

      - name: Upload installer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fingvibe-installer-logs-pr-${{ github.event.pull_request.number || github.run_number }}-attempt-${{ github.run_attempt }}
          path: artifacts\installer-logs
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload tested installer
        uses: actions/upload-artifact@v4
        with:
          name: fingvibe-setup-win-x64-pr-${{ github.event.pull_request.number || github.run_number }}-attempt-${{ github.run_attempt }}
          path: artifacts\installer\*-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload runnable app
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: fingvibe-win-x64-pr-${{ github.event.pull_request.number || github.run_number }}-attempt-${{ github.run_attempt }}
          path: artifacts\fingvibe-win-x64
          if-no-files-found: error
          retention-days: 14

  build-comment:
    needs: installer
    if: >
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out comment publisher
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Post a new artifact link on pull request
        env:
          ARTIFACT_URL: ${{ needs.installer.outputs.artifact-url }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: pwsh
        run: |
          $marker = "<!-- fingvibe-pr-artifact -->"
          $body = @"
          $marker
          ## Windows build ready

          [Download the Windows x64 executable artifact]($env:ARTIFACT_URL)

          Build [$env:RUN_NUMBER, attempt $env:RUN_ATTEMPT]($env:RUN_URL). Unzip the download and run ``FingVibe.App.exe``. The artifact expires after 14 days.
          "@
          .\.github\scripts\Publish-PrComment.ps1 -Mode Append `
            -PullRequestNumber $env:PR_NUMBER -Repository $env:GITHUB_REPOSITORY -Marker $marker -Body $body

  ui-capture:
    needs: [changes, tests, build]
    if: >
      needs.changes.outputs.ui == 'true'
      && (
        github.event_name == 'workflow_dispatch'
        || (
          github.event.pull_request.head.repo.full_name == github.repository
          && (
            contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
            || github.event.pull_request.user.login == 'Copilot'
          )
        )
      )
    runs-on: windows-2025
    env:
      FINGVIBE_UI_REVIEW: "1"
    steps:
      - name: Check out source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the published payload
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: artifacts\ui-review-app

      - name: Prepare disposable desktop for wide Devices checks
        shell: powershell
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Test full-window screenshot capture
        id: capture-tests
        shell: pwsh
        run: .\tests\UiReviewScreenshot.Tests.ps1

      - name: Select changed views and states
        id: plan
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          ADDITIONAL_SCENARIOS: ${{ inputs.additional_scenarios }}
        shell: pwsh
        run: |
          .\.github\scripts\Select-UiReviewScenarios.ps1 `
            -PlanPath "${{ github.workspace }}\artifacts\ui-review\capture-plan.json" `
            -BaseRevision $env:BASE_REVISION -HeadRevision $env:HEAD_REVISION `
            -AdditionalScenarios $env:ADDITIONAL_SCENARIOS

      - name: Test sidebar navigation and appearance
        shell: powershell
        run: |
          .\tests\SidebarNavigation.Tests.ps1 `
            -AppPath "${{ github.workspace }}\artifacts\ui-review-app\FingVibe.App.exe" `
            -ScreenshotDirectory "${{ github.workspace }}\artifacts\ui-review\sidebar"

      - name: Verify Devices filters and conditional columns
        shell: pwsh
        run: |
          .\tests\DevicesList.Ui.Tests.ps1 `
            -AppPath "${{ github.workspace }}\artifacts\ui-review-app\FingVibe.App.exe" `
            -ScreenshotDirectory "${{ github.workspace }}\artifacts\ui-review\devices"

      - name: Verify build identity and About navigation
        shell: pwsh
        run: |
          .\tests\BuildIdentity.Ui.Tests.ps1 `
            -AppPath "${{ github.workspace }}\artifacts\ui-review-app\FingVibe.App.exe" `
            -Version "0.0.${{ github.run_number }}" `
            -BuildKind "${{ github.event_name == 'pull_request' && 'PullRequest' || 'Test' }}" `
            -BuildTimestamp "${{ needs.build.outputs.build-timestamp }}" `
            -BuildCommit "${{ github.sha }}" `
            -ScreenshotDirectory "${{ github.workspace }}\artifacts\ui-review\build-identity" `
            -PullRequestNumber ${{ github.event.pull_request.number || 0 }}

      - name: Verify network troubleshooting controls and privacy
        shell: pwsh
        run: |
          .\tests\NetworkTroubleshooting.Ui.Tests.ps1 `
            -AppPath "${{ github.workspace }}\artifacts\ui-review-app\FingVibe.App.exe" `
            -ScreenshotDirectory "${{ github.workspace }}\artifacts\ui-review\troubleshooting"

      - name: Verify Fing import preview, management return, and inventory status
        shell: pwsh
        run: |
          .\tests\FingImport.Ui.Tests.ps1 `
            -AppPath "${{ github.workspace }}\artifacts\ui-review-app\FingVibe.App.exe" `
            -ScreenshotDirectory "${{ github.workspace }}\artifacts\ui-review\fing-import"

      - name: Verify additional TCP and opt-in UDP service checks
        shell: pwsh
        run: |
          .\tests\AdditionalServices.Ui.Tests.ps1 `
            -AppPath "${{ github.workspace }}\artifacts\ui-review-app\FingVibe.App.exe" `
            -ScreenshotDirectory "${{ github.workspace }}\artifacts\ui-review\additional-services"

      - name: Exercise primary UI and capture required views
        id: smoke
        shell: pwsh
        run: |
          Start-Transcript -Path "artifacts\ui-review\smoke-test.log"
          try {
            .\.github\scripts\Invoke-UiReview.ps1 `
              -AppPath "${{ github.workspace }}\artifacts\ui-review-app\FingVibe.App.exe" `
              -ScreenshotDirectory "${{ github.workspace }}\artifacts\ui-review" `
              -CapturePlanPath "${{ github.workspace }}\artifacts\ui-review\capture-plan.json"
          } catch {
            Write-Host $_
            throw
          } finally {
            Stop-Transcript
          }

      - name: Upload UI review captures and diagnostics
        id: screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fingvibe-ui-review-pr-${{ github.event.pull_request.number || github.run_number }}-attempt-${{ github.run_attempt }}
          path: artifacts\ui-review\
          if-no-files-found: warn
          retention-days: 14

  ui-publish:
    needs: [changes, tests, build, installer, ui-capture]
    if: >
      !cancelled()
      && needs.changes.outputs.ui == 'true'
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
      && (
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
        || github.event.pull_request.user.login == 'Copilot'
      )
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out publishers
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download completed captures
        if: needs.ui-capture.result == 'success' && needs.installer.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: fingvibe-ui-review-pr-${{ github.event.pull_request.number }}-attempt-${{ github.run_attempt }}
          path: artifacts\ui-review

      - name: Publish screenshots for inline review
        id: pages
        if: needs.ui-capture.result == 'success' && needs.installer.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: pwsh
        run: |
          .\.github\scripts\Publish-UiReviewScreenshot.ps1 `
            -ManifestPath "${{ github.workspace }}\artifacts\ui-review\capture-manifest.json" `
            -PullRequestNumber $env:PR_NUMBER -Repository $env:GITHUB_REPOSITORY -RunId $env:GITHUB_RUN_ID

      - name: Add screenshots to pull request
        id: pr-comment
        if: needs.ui-capture.result == 'success' && needs.installer.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_BODY_PATH: ${{ steps.pages.outputs.body-path }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: pwsh
        run: |
          $body = Get-Content -LiteralPath $env:COMMENT_BODY_PATH -Raw
          .\.github\scripts\Publish-PrComment.ps1 -PullRequestNumber $env:PR_NUMBER `
            -Repository $env:GITHUB_REPOSITORY -Marker "<!-- fingvibe-ui-review -->" -Body $body
          $body >> $env:GITHUB_STEP_SUMMARY

      - name: Explain UI/UX review failure
        if: failure() || needs.tests.result == 'failure' || needs.build.result == 'failure' || needs.installer.result == 'failure' || needs.ui-capture.result == 'failure'
        env:
          TEST_RESULT: ${{ needs.tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          INSTALLER_RESULT: ${{ needs.installer.result }}
          CAPTURE_RESULT: ${{ needs.ui-capture.result }}
          PAGES_OUTCOME: ${{ steps.pages.outcome }}
          COMMENT_OUTCOME: ${{ steps.pr-comment.outcome }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: pwsh
        run: |
          $reasons = [System.Collections.Generic.List[string]]::new()
          if ($env:TEST_RESULT -eq "failure") { $reasons.Add("- Regression tests failed; installer and UI validation could not proceed. App publishing runs independently.") }
          if ($env:BUILD_RESULT -eq "failure") { $reasons.Add("- The Windows app could not be published or its validation payload could not be uploaded.") }
          if ($env:INSTALLER_RESULT -eq "failure") { $reasons.Add("- Installer packaging, lifecycle validation, or tested download publication failed. Inspect the installer job and its diagnostic logs.") }
          if ($env:CAPTURE_RESULT -eq "failure") { $reasons.Add("- Native UI validation or capture failed. Inspect the failed step and download available capture plans, screenshots, and diagnostic logs from this run.") }
          if ($env:PAGES_OUTCOME -eq "failure") { $reasons.Add("- Screenshot download/publication failed; see the run's diagnostic artifacts.") }
          if ($env:COMMENT_OUTCOME -eq "failure") { $reasons.Add("- Screenshots were published, but their PR comment could not be posted.") }
          if ($reasons.Count -eq 0) { $reasons.Add("- Review publication failed unexpectedly. Inspect the failed workflow step.") }
          $marker = "<!-- fingvibe-ui-review-failure -->"
          $body = "$marker`n## UI/UX review failed`n`n$($reasons -join "`n")`n`n[Open the failed validation run]($env:RUN_URL)"
          .\.github\scripts\Publish-PrComment.ps1 -PullRequestNumber $env:PR_NUMBER `
            -Repository $env:GITHUB_REPOSITORY -Marker $marker -Body $body

      - name: Clear resolved UI/UX failure comment
        if: success() && needs.ui-capture.result == 'success' && needs.installer.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: pwsh
        run: |
          .\.github\scripts\Publish-PrComment.ps1 -Mode Remove -PullRequestNumber $env:PR_NUMBER `
            -Repository $env:GITHUB_REPOSITORY -Marker "<!-- fingvibe-ui-review-failure -->"

  ui-ux-review:
    name: ui-ux-review
    needs: [changes, tests, build, installer, ui-capture, ui-publish]
    if: always() && inputs.appearance_archive != true
    runs-on: windows-latest
    steps:
      - name: Report validation result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          INSTALLER_RESULT: ${{ needs.installer.result }}
          TEST_REQUIRED: ${{ needs.changes.outputs.tests }}
          BUILD_REQUIRED: ${{ needs.changes.outputs.build }}
          UI_REQUIRED: ${{ needs.changes.outputs.ui }}
          CAPTURE_RESULT: ${{ needs.ui-capture.result }}
          PUBLISH_RESULT: ${{ needs.ui-publish.result }}
          TRUSTED: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) || github.event.pull_request.user.login == 'Copilot')) }}
          EVENT_NAME: ${{ github.event_name }}
        shell: pwsh
        run: |
          if ($env:CHANGES_RESULT -ne "success") { throw "Validation planning failed or was cancelled." }
          if ($env:TEST_REQUIRED -notin @("true", "false") -or $env:BUILD_REQUIRED -notin @("true", "false") -or $env:UI_REQUIRED -notin @("true", "false")) {
            throw "Validation planning returned missing or invalid requirements."
          }
          $expectedTests = if ($env:TEST_REQUIRED -eq "true") { "success" } else { "skipped" }
          $expectedBuild = if ($env:BUILD_REQUIRED -eq "true") { "success" } else { "skipped" }
          if ($env:TEST_RESULT -ne $expectedTests -or $env:BUILD_RESULT -ne $expectedBuild) {
            throw "Prerequisite tests/build did not pass."
          }
          if ($env:INSTALLER_RESULT -ne $expectedBuild) {
            throw "Required installer validation/download publication did not complete successfully."
          }
          if ($env:UI_REQUIRED -ne "true") {
            "Native UI review is not required for documentation/test-only changes." >> $env:GITHUB_STEP_SUMMARY
          } elseif ($env:TRUSTED -ne "true") {
            "Native UI review was not run: fork/untrusted PR restrictions are preserved." >> $env:GITHUB_STEP_SUMMARY
          } else {
            if ($env:TEST_RESULT -ne "success" -or $env:BUILD_RESULT -ne "success" -or $env:CAPTURE_RESULT -ne "success") {
              throw "Required build, tests, or native UI validation did not complete successfully."
            }
            if ($env:EVENT_NAME -eq "pull_request" -and $env:PUBLISH_RESULT -ne "success") {
              throw "Required screenshot publication/commenting did not complete successfully."
            }
            "Native UI review passed using the tested build artifact." >> $env:GITHUB_STEP_SUMMARY
          }
