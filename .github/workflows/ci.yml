name: Pull request build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Test networking core
        run: dotnet test tests\FingVibe.Core.Tests\FingVibe.Core.Tests.csproj --configuration Release

      - name: Test speed-test bridge
        run: node --test tests\SpeedTestHost.Tests.cjs

      - name: Publish Windows x64 app
        shell: pwsh
        run: |
          msbuild src\FingVibe.App\FingVibe.App.csproj `
            /restore `
            /target:Publish `
            /property:Configuration=Release `
            /property:Platform=x64 `
            /property:RuntimeIdentifier=win-x64 `
            /property:SelfContained=true `
            /property:Version=0.0.${{ github.run_number }} `
            /property:BuildKind=${{ github.event_name == 'pull_request' && 'PullRequest' || 'Test' }} `
            /property:PullRequestNumber=${{ github.event.pull_request.number }} `
            /property:BuildCommit=${{ github.sha }} `
            /property:BuildUrl="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" `
            /property:PublishDir="${{ github.workspace }}\artifacts\fingvibe-win-x64\"

      - name: Verify published application icons
        shell: pwsh
        run: .\tests\ApplicationIcon.Tests.ps1 -AppDirectory "${{ github.workspace }}\artifacts\fingvibe-win-x64"

      - name: Upload runnable app
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: fingvibe-win-x64-pr-${{ github.event.pull_request.number || github.run_number }}
          path: artifacts\fingvibe-win-x64
          if-no-files-found: error
          retention-days: 14

      - name: Post artifact link on pull request
        if: >
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: pwsh
        run: |
          $marker = "<!-- fingvibe-pr-artifact -->"
          $body = @"
          $marker
          ## Windows build ready

          [Download the Windows x64 executable artifact]($env:ARTIFACT_URL)

          Unzip the download and run ``FingVibe.App.exe``. The artifact expires after 14 days.
          "@

          $comments = gh api `
            "repos/$env:GITHUB_REPOSITORY/issues/$env:PR_NUMBER/comments" `
            --paginate | ConvertFrom-Json
          $existing = $comments |
            Where-Object { $_.user.login -eq "github-actions[bot]" -and $_.body.Contains($marker) } |
            Select-Object -First 1

          if ($existing) {
            @{ body = $body } |
              ConvertTo-Json |
              gh api --method PATCH `
                "repos/$env:GITHUB_REPOSITORY/issues/comments/$($existing.id)" `
                --input -
          } else {
            gh pr comment $env:PR_NUMBER --body $body
          }
